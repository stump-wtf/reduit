# Reduit — example configuration.
#
# Reduit is a single-user, local-first Proton Mail tool (ADR-0012): a
# stdio MCP server for agents, a Bubble Tea TUI for humans, and a sync
# engine that caches mail locally. There are no network listeners except
# the reserved-for-future `serve` stub (ui.listen_addr below).
#
# Every field is OPTIONAL — config.Defaults() ships sane values for all
# of them, so an absent file works. Copy this to
# ~/.config/reduit/reduit.yaml, or point at it with --config / REDUIT_CONFIG.
# Config path precedence: --config flag, REDUIT_CONFIG env,
# ~/.config/reduit/reduit.yaml, ./reduit.yaml.
#
# Env overrides: any key is overridable as REDUIT_<SECTION>_<KEY>
# (e.g. REDUIT_SYNC_CONCURRENCY=5). Secrets support the "_FILE" variant
# whose value is a path to a file containing the secret (Docker/Kubernetes
# secrets convention); the "_FILE" form wins when both are set.
#
# Proton credentials do NOT live here — they are in the OS keychain
# (ADR-0013), provisioned via `reduit auth add`.

# Where Reduit keeps the SQLite cache and other local data.
# Default: ~/.local/share/reduit
#data_dir: /var/lib/reduit

llm:
  # One OpenAI-compatible egress, two model roles (ADR-0018).
  # Text/embedding role — chat model (search, summarise, contact-facts,
  # RAG) and embedding model. Local by default (LiteLLM proxy → Ollama).
  #base_url: http://localhost:4000/v1
  #text_model: ollama/llama3.2
  #embed_model: nomic-embed-text
  # api_key comes from REDUIT_LLM_API_KEY (or REDUIT_LLM_API_KEY_FILE);
  # empty is fine for local proxies. Never commit a key here.

  # Multimodal role (OCR/vision/audio) — OPT-IN, empty disables it.
  # Configure independently so text can stay fully local while only
  # media goes to a hosted endpoint, by deliberate choice. This is
  # Reduit's heaviest, most sensitive egress (raw image/audio bytes).
  #multimodal_base_url:
  #multimodal_model:
  # Key from REDUIT_LLM_MULTIMODAL_API_KEY (or ..._FILE).

proton:
  # App-version string sent as x-pm-appversion. Empty resolves to the
  # Bridge family default, which Proton waves through without a CAPTCHA
  # (ADR-0021). The literal "auto" detects "web-mail@<version>" — which
  # Proton WILL challenge, so it is opt-in only. Must be consistent
  # across auth and later commands or the session breaks (10013).
  #app_version: ""
  # Proton API base URL; empty targets production. Only set for a
  # test/self-hosted server.
  #host_url: ""

sync:
  # First sync of a mailbox backfills this window; later runs tail
  # Proton's event stream (SPEC-0002). Any Go duration; "0" backfills
  # the FULL mailbox. Default: 8760h (one year).
  #backfill_window: 8760h
  # Mailboxes synced in parallel in one run, bounding in-flight Proton
  # requests. Default: 3.
  #concurrency: 3

logger:
  #level: info     # debug | info | warn | error
  #format: text    # text | json

ui:
  # Listen address for the reserved-for-future `serve` stub (the web UI
  # is retired — ADR-0025). Only used if `serve` ever ships as
  # MCP-over-HTTP or a loopback media-companion. Non-loopback binds log
  # a loud warning (no auth is shipped).
  #listen_addr: 127.0.0.1:8787
